[pytest]
# Test suite lives under tests/, grouped by concern:
#   tests/unit         pure/fast, no Docker
#   tests/server       Phase 7 webhook (FastAPI TestClient, mocked)
#   tests/integration  needs a running Docker daemon (sandbox, full pipeline)
testpaths = tests
python_files = test_*.py
markers =
    docker: test requires a running Docker daemon (deselect with -m "not docker")
