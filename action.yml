name: 'CIDRA Debug & Repair'
description: 'Autonomous CI Debugging and Repair Agent. Diagnoses failures and verifies fixes using a hardened Docker sandbox.'
inputs:
  api_key:
    description: 'LLM Provider API Key (e.g., OpenAI, Gemini, Anthropic)'
    required: true
  model:
    description: 'LLM Model to use'
    required: false
    default: 'gpt-4o'
  model_analyze:
    description: 'LLM Model for analyze phase'
    required: false
  model_fix:
    description: 'LLM Model for fix phase'
    required: false
  base_url:
    description: 'Base URL for the LLM API'
    required: false
  github_token:
    description: 'GitHub token for posting comments'
    required: false
    default: ${{ github.token }}
  nvidia_api_key_kimi:
    description: 'NVIDIA API Key for Kimi-k3 fallback'
    required: false
  nvidia_api_key_glm:
    description: 'NVIDIA API Key for GLM-5.3 fallback'
    required: false
  groq_api_key:
    description: 'Groq API Key for Llama fallback'
    required: false
  openrouter_api_key:
    description: 'OpenRouter API Key 1 for fallback'
    required: false
  openrouter_api_key_2:
    description: 'OpenRouter API Key 2 for fallback'
    required: false
  enable_pr_creation:
    description: 'If true, CIDRA will open a PR with the verified fix'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install CIDRA
      shell: bash
      run: |
        # In a real release, this could simply be `pip install cidra`
        # But for the action living in this repo, we install it from the action's source path
        pip install ${{ github.action_path }}
        
    - name: Pull Docker Base Image
      shell: bash
      run: |
        docker build -t cidra-sandbox:base -f ${{ github.action_path }}/cidra/sandbox/Dockerfile ${{ github.action_path }}/cidra/sandbox

    - name: Run CIDRA
      shell: bash
      env:
        CIDRA_API_KEY: ${{ inputs.api_key }}
        CIDRA_BASE_URL: ${{ inputs.base_url }}
        CIDRA_MODEL_ANALYZE: ${{ inputs.model_analyze }}
        CIDRA_MODEL_FIX: ${{ inputs.model_fix }}
        CIDRA_ENABLE_RATE_LIMIT_BACKOFF: 'true'
        CIDRA_GITHUB_TOKEN: ${{ inputs.github_token }}
        NVIDIA_API_KEY_KIMI: ${{ inputs.nvidia_api_key_kimi }}
        NVIDIA_API_KEY_GLM: ${{ inputs.nvidia_api_key_glm }}
        GROQ_API_KEY: ${{ inputs.groq_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENROUTER_API_KEY_2: ${{ inputs.openrouter_api_key_2 }}
        CIDRA_ENABLE_PR_CREATION: ${{ inputs.enable_pr_creation }}
      run: |
        cidra action
