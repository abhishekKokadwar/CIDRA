name: 'CIDRA Debug & Repair'
description: 'Autonomous CI Debugging and Repair Agent. Diagnoses failures and verifies fixes using a hardened Docker sandbox.'
branding:
  icon: 'tool'
  color: 'green'
inputs:
  mode:
    description: >-
      "fix" (default): diagnose a failed CI run and propose a verified fix, with your model key.
      "check-pr": check the fix in a pull request with the gate, on a pull_request event. No model
      and no key: the failure must reproduce on the base, the diff must pass the audit, and the
      tests failing on the base must pass with nothing else breaking. The job fails unless verified.
    required: false
    default: 'fix'
  comment:
    description: 'check-pr mode: post the verdict as a pull request comment, updated on each push (needs pull-requests: write).'
    required: false
    default: 'true'
  api_key:
    description: 'API key for base_url. Needed in fix mode; check-pr mode uses no model.'
    required: false
  model_analyze:
    description: 'Model for the diagnosis, for example claude-haiku-4-5. Unset: gemini-3.5-flash.'
    required: false
  model_fix:
    description: 'Model for the fix, for example claude-haiku-4-5. Unset: gemini-3.5-flash.'
    required: false
  base_url:
    description: 'OpenAI-compatible endpoint of the model provider, for example https://api.anthropic.com/v1/. Unset: Gemini.'
    required: false
  github_token:
    description: 'GitHub token for posting comments'
    required: false
    default: ${{ github.token }}
  github_token_ro:
    description: 'Optional read-only token used to fetch CI logs. Defaults to github_token.'
    required: false
  gemini_api_key:
    description: 'Optional Gemini API key. If set, a failed call to the main model is retried once on Gemini.'
    required: false
  enable_pr_creation:
    description: 'If true, CIDRA will open a PR with the verified fix'
    required: false
    default: 'false'
  source_dir:
    description: 'Path to the checkout of the commit whose CI failed. Defaults to the workspace root.'
    required: false
  install_command:
    description: >-
      One pip command that installs the dependencies in the sandbox, for example
      "pip install --quiet -r requirements-dev.txt" or "pip install --quiet pytest httpx".
      CIDRA appends --target, so it must be a single pip install. The project itself is
      imported from the source tree. Unset: requirements.txt (with requirements-dev/test files beside it),
      else the package itself from pyproject.toml or setup.py with its test extra, else nothing.
    required: false
  test_command:
    description: >-
      Command that runs the tests in the sandbox, with no network, for example
      "PYTHONPATH=src pytest -q 2>&1". Defaults to "pytest -q 2>&1".
    required: false

outputs:
  verdict:
    description: 'check-pr mode: verified, refused, not_verified, not_reproduced or error.'
    value: ${{ steps.check.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
        
    - name: Install CIDRA
      shell: bash
      run: |
        # The CIDRA at this action's own tag, so the action and the package always match
        pip install ${{ github.action_path }}
        
    - name: Pull Docker Base Image
      shell: bash
      run: |
        docker build -t cidra-sandbox:base -f ${{ github.action_path }}/cidra/sandbox/Dockerfile ${{ github.action_path }}/cidra/sandbox

    - name: Run CIDRA
      if: inputs.mode != 'check-pr'
      shell: bash
      env:
        CIDRA_API_KEY: ${{ inputs.api_key }}
        CIDRA_BASE_URL: ${{ inputs.base_url }}
        CIDRA_MODEL_ANALYZE: ${{ inputs.model_analyze }}
        CIDRA_MODEL_FIX: ${{ inputs.model_fix }}
        CIDRA_GITHUB_TOKEN: ${{ inputs.github_token }}
        CIDRA_GITHUB_TOKEN_RO: ${{ inputs.github_token_ro }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        CIDRA_ENABLE_PR_CREATION: ${{ inputs.enable_pr_creation }}
        CIDRA_SOURCE_DIR: ${{ inputs.source_dir }}
        CIDRA_INSTALL_COMMAND: ${{ inputs.install_command }}
        CIDRA_TEST_COMMAND: ${{ inputs.test_command }}
      run: |
        cidra action

    # check-pr mode. The pull request's code runs only inside CIDRA's sandbox, which has
    # no network and no secrets; this step gets no token at all.
    - name: Check the pull request
      id: check
      if: inputs.mode == 'check-pr'
      shell: bash
      env:
        CIDRA_SOURCE_DIR: ${{ inputs.source_dir }}
        CIDRA_INSTALL_COMMAND: ${{ inputs.install_command }}
        CIDRA_TEST_COMMAND: ${{ inputs.test_command }}
      run: |
        cidra check-pr --out "$RUNNER_TEMP/cidra-verdict.md"

    # Posts the verdict. Runs no code from the pull request: only gh, with the token.
    - name: Comment on the pull request
      if: always() && inputs.mode == 'check-pr' && inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        [ -s "$RUNNER_TEMP/cidra-verdict.md" ] || exit 0
        body="$RUNNER_TEMP/cidra-verdict.md"
        # One comment per pull request, updated on each push; the first push creates it.
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body-file "$body" \
          || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body" \
          || echo "::warning::Could not comment on the pull request (one from a fork gets a read-only token); the verdict is in the job summary."
