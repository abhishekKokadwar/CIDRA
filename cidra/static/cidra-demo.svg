<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes lineFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .term-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13.5px;
      line-height: 22px;
    }
    .cmd { fill: #58a6ff; font-weight: 600; }
    .prompt { fill: #3fb950; font-weight: 600; }
    .muted { fill: #8b949e; }
    .success { fill: #3fb950; font-weight: 600; }
    .highlight { fill: #d29922; }
    .tag { fill: #bc8cff; font-weight: 600; }
    .cyan { fill: #39c5cf; }
    .cursor {
      animation: blink 1s step-end infinite;
      fill: #58a6ff;
    }
    .step-1 { animation: lineFade 0.4s ease forwards; animation-delay: 0.1s; }
    .step-2 { animation: lineFade 0.4s ease forwards; animation-delay: 0.3s; }
    .step-3 { animation: lineFade 0.4s ease forwards; animation-delay: 0.5s; }
    .step-4 { animation: lineFade 0.4s ease forwards; animation-delay: 0.7s; }
    .step-5 { animation: lineFade 0.4s ease forwards; animation-delay: 0.9s; }
    .step-6 { animation: lineFade 0.4s ease forwards; animation-delay: 1.1s; }
  </style>

  <!-- Window Container with Shadow -->
  <rect x="15" y="15" width="820" height="410" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Subtle top accent glow -->
  <rect x="16" y="16" width="818" height="2" rx="1" fill="url(#glow-grad)" />

  <!-- Header Bar -->
  <rect x="15" y="15" width="820" height="42" rx="12" fill="#161b22" />
  <rect x="15" y="45" width="820" height="12" fill="#161b22" />
  <line x1="15" y1="57" x2="835" y2="57" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="38" cy="36" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="58" cy="36" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="78" cy="36" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Title -->
  <text x="425" y="41" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5" font-weight="500">
    cidra-engine — zsh • 80x24
  </text>
  <text x="805" y="41" text-anchor="end" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">
    ● LIVE
  </text>

  <!-- Terminal Content -->
  <g class="term-text" transform="translate(42, 90)">
    <!-- Command Prompt -->
    <text x="0" y="0">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cmd">cidra diagnose --verify-fix</tspan>
      <tspan class="muted"> --repo=Abhishek86798/CIDRA</tspan>
    </text>

    <!-- Execution Steps -->
    <g class="step-1" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan class="cyan">ℹ [1/5] Ingesting failure</tspan>
        <tspan class="muted"> ➔ GitHub run #1892: </tspan>
        <tspan fill="#f85149">FAILED (exit code 1)</tspan>
      </text>
    </g>

    <g class="step-2" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan class="cyan">ℹ [2/5] Fault localization</tspan>
        <tspan class="muted"> ➔ Ochiai SBFL ranked </tspan>
        <tspan class="tag">auth/jwt.py:42</tspan>
        <tspan class="highlight"> (score: 0.94)</tspan>
      </text>
    </g>

    <g class="step-3" transform="translate(0, 84)">
      <text x="0" y="0">
        <tspan class="cyan">ℹ [3/5] Flakiness check</tspan>
        <tspan class="muted"> ➔ 5/5 trials reproduced deterministic RED </tspan>
        <tspan class="success">[SR-08: NOT FLAKY]</tspan>
      </text>
    </g>

    <g class="step-4" transform="translate(0, 112)">
      <text x="0" y="0">
        <tspan class="cyan">ℹ [4/5] AST Policy Audit</tspan>
        <tspan class="muted"> ➔ Patch syntax parsed </tspan>
        <tspan class="success">✔ PASS</tspan>
        <tspan class="muted"> (0 unauthorized sys calls, ADV-07 compliant)</tspan>
      </text>
    </g>

    <g class="step-5" transform="translate(0, 140)">
      <text x="0" y="0">
        <tspan class="cyan">ℹ [5/5] Docker Sandbox</tspan>
        <tspan class="muted"> ➔ Network: </tspan>
        <tspan class="tag">NONE</tspan>
        <tspan class="muted"> | RED ➔ PATCH APPLIED ➔ </tspan>
        <tspan class="success">GREEN (Exit: 0)</tspan>
      </text>
    </g>

    <!-- Outcome Box -->
    <g class="step-6" transform="translate(0, 180)">
      <rect x="-8" y="-18" width="765" height="74" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.2" />
      <text x="14" y="10">
        <tspan class="success">✔ SUCCESS:</tspan>
        <tspan fill="#e6edf3" font-weight="600"> Autonomous Fix Verified Green</tspan>
        <tspan class="muted"> (0 false claims • MTTR: 38s • Tokens: 1,184)</tspan>
      </text>
      <text x="14" y="36">
        <tspan class="muted">  ➔ Draft Pull Request: </tspan>
        <tspan class="cmd">https://github.com/Abhishek86798/CIDRA/pull/14</tspan>
        <tspan class="tag"> [HITL GATED]</tspan>
      </text>
    </g>

    <!-- Active Terminal Prompt -->
    <text x="0" y="290">
      <tspan class="prompt">❯ </tspan>
      <rect class="cursor" x="16" y="276" width="8" height="17" rx="1" />
    </text>
  </g>
</svg>
