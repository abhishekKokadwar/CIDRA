[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cidra"
version = "0.3.1"
description = "Continuous Integration Debugging and Repair Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CIDRA Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph",
    "pydantic",
    "docker",
    "fastapi",
    "uvicorn",
    "openai",
    "python-dotenv",
    "pyyaml",
    "httpx",
    "tomli>=1.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.17,<0.18",
    "mypy>=1.13"
]

[project.scripts]
cidra = "cidra.cli:main"

[tool.setuptools.packages.find]
include = ["cidra", "cidra.*"]

[tool.setuptools.package-data]
cidra = [
    "static/**",
    "static/**/*",
    "sandbox/Dockerfile"
]

# CI combines the unit, server and integration runs and fails below this floor
# (the coverage job in test-cidra.yml). Raise it when coverage rises; never lower it
# to get a change through.
[tool.coverage.run]
source = ["cidra"]
relative_files = true

[tool.coverage.report]
fail_under = 88
skip_empty = true

# Errors and likely bugs, not style: pyflakes (F), import and syntax errors
# (E4, E7, E9) and bugbear (B). CI runs `ruff check` in the unit job.
[tool.ruff]
target-version = "py310"
extend-exclude = ["worktrees", "dashboard", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E701", "E702", "E731"]  # one-line statements and named lambdas: style only

[tool.ruff.lint.per-file-ignores]
# Scripts set environment variables before importing cidra, on purpose: cidra.config
# reads them at import time (see eval/measure.py).
"eval/**" = ["E402"]
"scripts/**" = ["E402"]

# Type checks on cidra/ (CI's unit job). Third-party packages without type
# information are skipped, not errors.
[tool.mypy]
files = ["cidra"]
python_version = "3.10"
ignore_missing_imports = true
