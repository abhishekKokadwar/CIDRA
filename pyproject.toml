[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cidra"
version = "0.3.1"
description = "Continuous Integration Debugging and Repair Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CIDRA Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph",
    "pydantic",
    "docker",
    "fastapi",
    "uvicorn",
    "openai",
    "python-dotenv",
    "pyyaml",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]

[project.scripts]
cidra = "cidra.cli:main"

[tool.setuptools.packages.find]
include = ["cidra", "cidra.*"]

[tool.setuptools.package-data]
cidra = [
    "static/**",
    "static/**/*",
    "sandbox/Dockerfile"
]

# CI combines the unit, server and integration runs and fails below this floor
# (the coverage job in test-cidra.yml). Raise it when coverage rises; never lower it
# to get a change through.
[tool.coverage.run]
source = ["cidra"]
relative_files = true

[tool.coverage.report]
fail_under = 88.5
skip_empty = true
