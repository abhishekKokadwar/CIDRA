name: CIDRA Bot

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Run CIDRA
      uses: ./
      with:
        api_key: ${{ secrets.OPENROUTER_API_KEY }}
        base_url: 'https://openrouter.ai/api/v1'
        model_analyze: 'nvidia/nemotron-3-super-120b-a12b:free'
        model_fix: 'nvidia/nemotron-3-super-120b-a12b:free'
        nvidia_api_key_kimi: ${{ secrets.NVIDIA_API_KEY_KIMI }}
        nvidia_api_key_glm: ${{ secrets.NVIDIA_API_KEY_GLM }}
        groq_api_key: ${{ secrets.GROQ_API_KEY }}
        enable_pr_creation: 'true'
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit & Push Run Telemetry
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add dashboard/public/telemetry.json cidra/static/telemetry.json || true
        git commit -m "chore(telemetry): update CIDRA run telemetry [skip ci]" || true
        git push origin HEAD:main || true

    - name: Trigger Vercel Live Dashboard Rebuild
      if: always()
      run: |
        if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
          echo "Pinging Vercel Deploy Hook..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        else
          echo "VERCEL_DEPLOY_HOOK secret not set, skipping deploy hook."
        fi

