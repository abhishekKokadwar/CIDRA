name: CIDRA Bot

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Run CIDRA
      uses: ./
      with:
        api_key: ${{ secrets.GEMINI_API_KEY || secrets.CIDRA_API_KEY || secrets.OPENROUTER_API_KEY }}
        base_url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
        model_analyze: 'gemini-3.8-flash'
        model_fix: 'gemini-3.8-flash'
        nvidia_api_key_kimi: ${{ secrets.NVIDIA_API_KEY_KIMI }}
        nvidia_api_key_glm: ${{ secrets.NVIDIA_API_KEY_GLM }}
        groq_api_key: ${{ secrets.GROQ_API_KEY }}
        enable_pr_creation: 'true'
        github_token: ${{ secrets.GITHUB_TOKEN }}
