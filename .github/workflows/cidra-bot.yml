name: CIDRA Bot

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
    # The action itself always runs from the default branch (trusted code).
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The commit whose CI failed goes in a subfolder: it is only ever copied
    # into the sandbox, never executed on the runner next to the secrets.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        path: cidra-target
        persist-credentials: false

    - name: Run CIDRA
      uses: ./
      with:
        source_dir: ${{ github.workspace }}/cidra-target
        # Claude is the model CIDRA is measured with; Gemini is tried only when a call fails.
        api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        base_url: 'https://api.anthropic.com/v1/'
        model_analyze: 'claude-haiku-4-5'
        model_fix: 'claude-haiku-4-5'
        gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        enable_pr_creation: 'true'
        github_token: ${{ secrets.GITHUB_TOKEN }}

    # Kept with the run, not committed: it holds full prompts and log excerpts,
    # and a commit per run buried main's history.
    - name: Upload run telemetry
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cidra-telemetry-${{ github.event.workflow_run.id }}
        path: dashboard/public/telemetry.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Trigger Vercel Live Dashboard Rebuild
      if: always()
      run: |
        if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
          echo "Pinging Vercel Deploy Hook..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        else
          echo "VERCEL_DEPLOY_HOOK secret not set, skipping deploy hook."
        fi

