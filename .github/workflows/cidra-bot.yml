name: CIDRA Bot

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
    # The action itself always runs from the default branch (trusted code).
    - uses: actions/checkout@v4

    # The commit whose CI failed goes in a subfolder: it is only ever copied
    # into the sandbox, never executed on the runner next to the secrets.
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        path: cidra-target
        persist-credentials: false

    - name: Run CIDRA
      uses: ./
      with:
        source_dir: ${{ github.workspace }}/cidra-target
        api_key: ${{ secrets.GEMINI_API_KEY }}
        base_url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
        model_analyze: 'gemini-3.5-flash'
        model_fix: 'gemini-3.5-flash'
        nvidia_api_key_kimi: ${{ secrets.NVIDIA_API_KEY_KIMI }}
        nvidia_api_key_glm: ${{ secrets.NVIDIA_API_KEY_GLM }}
        groq_api_key: ${{ secrets.GROQ_API_KEY }}
        openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
        openrouter_api_key_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
        enable_pr_creation: 'true'
        github_token: ${{ secrets.GITHUB_TOKEN }}

    # Kept with the run, not committed: it holds full prompts and log excerpts,
    # and a commit per run buried main's history.
    - name: Upload run telemetry
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cidra-telemetry-${{ github.event.workflow_run.id }}
        path: dashboard/public/telemetry.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Trigger Vercel Live Dashboard Rebuild
      if: always()
      run: |
        if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
          echo "Pinging Vercel Deploy Hook..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        else
          echo "VERCEL_DEPLOY_HOOK secret not set, skipping deploy hook."
        fi

