name: CI

# Tiered: a docs-only PR runs nothing but the gate; any other change runs every
# tier, then the requirements check. A push to main always runs everything.
#
# Branch protection requires only `ci-ok`. Do not add `paths:` filters to the
# triggers: a workflow that never starts never reports, and the PR stays blocked.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.tiers.outputs.code }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - id: tiers
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        code=false
        # Unknown paths count as code: a file missing from the list below runs every tier.
        while IFS= read -r f; do
          case "$f" in
            "") ;;
            docs/requirements.yml) code=true ;;  # what CI must prove: never on the docs path
            *.md|docs/*|LICENSE|.github/CODEOWNERS|.github/pull_request_template.md|eval/results/*) ;;
            *) code=true ;;
          esac
        done <<< "$(git diff --name-only "$BASE"...HEAD)"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "code changed: $code"

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install ".[dev]"
    - name: Lint (ruff; rules in pyproject.toml)
      run: ruff check --output-format=github .
    - name: Type check (mypy; settings in pyproject.toml)
      run: mypy
    - name: Unit and server tests
      env:
        CIDRA_REQ_REPORT: req-unit.json
        COVERAGE_FILE: coverage-unit
      run: pytest -q tests/unit tests/server --cov --cov-report= --cov-fail-under=0  # the coverage job checks the combined total
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cov-unit
        path: coverage-unit
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: req-unit
        path: req-unit.json
        if-no-files-found: ignore

  compat:
    # The Pythons pyproject.toml accepts (>=3.10) and Windows, where people run the
    # CLI. Unit and server tests only: the unit job (3.11, Linux) also lints,
    # type-checks and measures coverage, and the sandbox needs Linux Docker.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
    name: compat (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - run: pip install ".[dev]"
    - run: pytest -q tests/unit tests/server

  sandbox:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install ".[dev]"
    - run: docker build -t cidra-sandbox:base -f cidra/sandbox/Dockerfile cidra/sandbox
    - name: Integration tests (real sandbox)
      env:
        CIDRA_REQ_REPORT: req-integration.json
        COVERAGE_FILE: coverage-integration
      run: pytest -q tests/integration --cov --cov-report= --cov-fail-under=0  # the coverage job checks the combined total
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cov-integration
        path: coverage-integration
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: req-integration
        path: req-integration.json
        if-no-files-found: ignore
    - name: Adversarial containment (G-05)
      env:
        CIDRA_CANARY_SECRET: ci-canary-${{ github.run_id }}  # without it the secret-theft check proves nothing
      run: python eval/adversarial/run_adversarial.py
    - name: Security benchmark (G-05)
      run: python eval/security_fixtures/run_benchmark.py --tier 2

  pipeline:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install ".[dev]"
    - run: docker build -t cidra-sandbox:base -f cidra/sandbox/Dockerfile cidra/sandbox
    - run: git clone --quiet https://github.com/helpmecode69/cidra-practice "$RUNNER_TEMP/cidra-practice"
    - name: Full pipeline on the practice fixtures (stub model)
      env:
        CIDRA_PRACTICE_REPO: ${{ runner.temp }}/cidra-practice
      run: python eval/measure.py --stub --check --out "$RUNNER_TEMP/stub.json"

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: dashboard/package-lock.json
    - run: npm ci
    - run: npm run lint
    - name: Component tests
      run: npx vitest run --reporter=default --reporter=json --outputFile.json=../req-frontend.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: req-frontend
        path: req-frontend.json
        if-no-files-found: ignore
    - name: The dashboard CIDRA ships (cidra/static) is built from this source
      run: |
        npm run build
        stale=$(git status --porcelain ../cidra/static)
        if [ -n "$stale" ]; then
          echo "$stale"
          echo "::error::cidra/static is out of date. Run 'npm run build' in dashboard/ and commit cidra/static."
          exit 1
        fi

  e2e:
    # The real dashboard server on fixed scratch data, driven in Chromium.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install ".[dev]"
      working-directory: .
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: dashboard/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - name: Browser tests
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: ../req-e2e.json
      run: npx playwright test --reporter=list,json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: req-e2e
        path: req-e2e.json
        if-no-files-found: ignore
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: failure()
      with:
        name: e2e-traces
        path: dashboard/test-results
        if-no-files-found: ignore

  package:
    # What users install, not the source tree: the built wheel in a clean venv,
    # run from outside the checkout (scripts/check_package.py, smoke_installed.sh).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install build && python -m build
    - name: The wheel holds what users need
      run: python scripts/check_package.py dist/*.whl
    - name: Install the wheel in a clean environment
      run: python -m venv "$RUNNER_TEMP/user" && "$RUNNER_TEMP/user/bin/pip" install --quiet dist/*.whl
    - name: The installed package works (CLI, sandbox image, dashboard, cidra action)
      run: bash scripts/smoke_installed.sh "$RUNNER_TEMP/user/bin/python" https://github.com/helpmecode69/cidra-practice

  audit:
    # Known vulnerabilities in what CIDRA depends on: its Python dependencies as
    # pyproject.toml declares them, and the dashboard's npm packages (high and up).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install pip-audit
    - name: Python dependencies
      run: pip-audit .
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
    - name: Dashboard dependencies
      working-directory: dashboard
      run: npm audit --audit-level=high

  codeql:
    # Static analysis of CIDRA's own code. Findings appear on the pull request and in
    # the Security tab; the job fails if the analysis itself cannot run.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ python, javascript-typescript ]
    name: codeql (${{ matrix.language }})
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended  # a security product: the wider set of security queries
    - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: /language:${{ matrix.language }}

  coverage:
    # The unit, server and integration runs together, against the floor in
    # pyproject.toml ([tool.coverage.report] fail_under).
    needs: [ changes, unit, sandbox ]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
    - run: pip install coverage
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: cov-*
        merge-multiple: true
        path: cov
    - name: Combined coverage, against the floor
      run: |
        coverage combine cov/coverage-unit cov/coverage-integration
        coverage report --precision=1 --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"
        coverage report --precision=1

  requirements:
    # Every requirement in docs/requirements.yml has a test that passed in this run
    # (skipped does not count) and every CI job it names passed.
    needs: [ changes, unit, compat, sandbox, pipeline, frontend, e2e, package, audit, codeql, coverage ]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
    - run: pip install pyyaml
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: req-*
        merge-multiple: true
        path: req
    - name: Check every requirement is proven
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        jobs=$(python -c 'import json, os; print(json.dumps({k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items()}))')
        shopt -s nullglob
        python scripts/check_requirements.py docs/requirements.yml req/*.json --jobs "$jobs"

  ci-ok:
    needs: [ changes, unit, compat, sandbox, pipeline, frontend, e2e, package, audit, codeql, coverage, requirements ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Every tier that ran passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "tier results: $RESULTS"
        case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
