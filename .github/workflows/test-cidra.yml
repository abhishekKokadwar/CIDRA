name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pydantic openai docker httpx

    - name: Run tests
      run: |
        pytest -q 2>&1

    - name: Run CIDRA on failure
      if: failure()
      uses: ./
      with:
        api_key: ${{ secrets.OPENROUTER_API_KEY }}
        nvidia_api_key_kimi: ${{ secrets.NVIDIA_API_KEY_KIMI }}
        nvidia_api_key_glm: ${{ secrets.NVIDIA_API_KEY_GLM }}
        enable_pr_creation: 'true'
        github_token: ${{ secrets.GITHUB_TOKEN }}
