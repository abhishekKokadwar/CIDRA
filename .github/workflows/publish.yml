name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:  # a change to this workflow runs the build and checks; nothing is published
    paths: [ .github/workflows/publish.yml ]

jobs:
  build:
    # Build once and run CI's package checks on that exact wheel and sdist; the
    # publish job uploads these files and nothing else. The dashboard ships as
    # committed in cidra/static, which CI's frontend job checks against its source.
    name: Build and check the release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build package
        run: python -m pip install build && python -m build
      - name: The release tag names the version being built
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "v$version" ] || { echo "::error::release tag $TAG does not match pyproject.toml version $version"; exit 1; }
      - name: The wheel holds what users need
        run: python scripts/check_package.py dist/*.whl
      - name: Install the wheel in a clean environment
        run: python -m venv "$RUNNER_TEMP/user" && "$RUNNER_TEMP/user/bin/pip" install --quiet dist/*.whl
      - name: The installed package works (CLI, sandbox image, dashboard, cidra action)
        run: bash scripts/smoke_installed.sh "$RUNNER_TEMP/user/bin/python" https://github.com/helpmecode69/cidra-practice
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC), no token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
