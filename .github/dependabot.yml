# Weekly update PRs for each ecosystem CIDRA uses. Each one runs the full CI before
# it can merge; majors come as their own PRs, so a breaking upgrade stays visible.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor: { update-types: [ minor, patch ] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [ minor, patch ] }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [ minor, patch ] }
