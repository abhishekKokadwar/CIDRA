# What CIDRA must do, each with its evidence in CI (ROADMAP §2 and the milestones).
#
# A requirement holds when at least one test tagged @pytest.mark.req("<id>") ran and
# passed in the CI run, and every job it lists passed. A skipped test is not evidence.
# scripts/check_requirements.py enforces this; CI's `requirements` job fails otherwise.
#
# Adding a requirement: add it here, tag the tests that prove it, and keep the
# acceptance line to what those tests actually check.

- id: R1
  title: Authenticate the incoming event
  accept: Webhook deliveries are accepted only with a valid HMAC signature; a missing, wrong or malformed one is rejected before anything runs.

- id: R2
  title: Get the failing commit without exposing secrets to its code
  accept: The commit's code runs only in the sandbox, which has no host secrets, no network for tests and no Docker socket; the fetch token never reaches argv or disk.

- id: R3
  title: Reproduce the original failure
  accept: The CI log's failing tests must fail in the sandbox, twice for a failure CIDRA would patch; otherwise the run is not reproduced or is flaky.

- id: R4
  title: Generate a patch
  accept: The model's edits become a diff that applies to the checkout, built from code it was shown and the failing test's full assertion diff; an edit that cannot be placed is reported back.

- id: R5
  title: Reject test-weakening or unsafe patches
  accept: The audit gate refuses deleted or skipped tests, CI edits, stand-in modules, hardcoded answers, and test-file edits beyond assert expected values.

- id: R6
  title: Apply to a clean copy and rerun
  accept: Each attempt applies to the checkout as it arrived, never on top of an earlier attempt.

- id: R7
  title: Original failure fixed, no unrelated regressions
  accept: Verified only when the target tests pass and no test that passed before fails; tests already failing are listed, not blocking.

- id: R8
  title: Draft PR with evidence of what was tested
  accept: Only a verified fix opens a draft PR (never merged) and claims a fix; other outcomes say so without a diff.

- id: M1-JUNIT
  title: Per-test results before and after the patch
  accept: Every sandbox test run leaves a JUnit report, read whole, kept before (repro_junit) and after (verify_junit) the patch.

- id: M1-G18
  title: Say why a run stopped
  accept: An install failure or a non-reproduction is reported with its reason, the command run and the input to change.

- id: M1-E2E
  title: The whole pipeline works end to end
  accept: The 7 practice fixtures run through the full graph with the stub model and each ends as expected (verified fix, diagnosis only, flaky).
  jobs: [pipeline]

- id: M1-G05
  title: Adversarial and security suites
  accept: Hostile payloads stay contained in the real sandbox and the security benchmark has no FAIL.
  jobs: [sandbox]

- id: M2-EVIDENCE
  title: Evidence in every report
  accept: Every report from a run that reached the sandbox shows the failing commit, the exact image, the install and test commands, the audit verdict, any dependency change, model usage, and each test's outcome before and after the patch.

- id: M2-RERUN
  title: Rerun a fix's verification locally
  accept: "`cidra verify --sha <commit> --patch <diff>` reruns reproduce, apply and verify in the sandbox (exit 0 only when the targets go red to green with no regression), and every report with a patch prints that command, shell-quoted."

- id: M2-COST
  title: Cost of the run
  accept: The report's model line shows the run's cost from tokens times a known price (CIDRA_PRICE_IN/OUT, else a list price for a listed model), labelled with its source; an unknown model shows no cost rather than a guess.

- id: M4-INSTALL
  title: Install a repository nobody configured
  accept: With no install command set, CIDRA installs requirements.txt (with dev/test companions), else the package from pyproject.toml or setup.py with its test extra, else nothing; an explicit command always wins, and an install that adds no packages still succeeds.

- id: M4-PUBLISH
  title: Report where people will see it, and say why when GitHub refuses
  accept: A run with no pull request comments on the failing commit (updating its own earlier comment); a refused GitHub write never crashes the run and, on a 403, names the workflow permission to add, in the log and the job summary.

- id: M4-QUICKSTART
  title: The README quick start works as written
  accept: The quick start's workflow is valid YAML with the permissions CIDRA's writes need, every input it passes to the action exists in action.yml, and every action input is wired to CIDRA, so no setting in the quick start is silently ignored.

- id: UI-OUTCOME
  title: The dashboard labels each run by how it ended
  accept: Every run's badge reads its outcome (verified fix, diagnosis only, flaky test, failed); a finished run is never shown as pending.

- id: UI-KEYS
  title: Settings counts the keys that are set
  accept: The credentials panel shows how many keys are set out of how many it lists, not the number of rows.

- id: UI-VERSION
  title: The dashboard shows its real version
  accept: The sidebar, open or collapsed, shows the version in pyproject.toml, the package the dashboard ships in.

- id: UI-OWN-RUNS
  title: The dashboard shows your runs
  accept: /telemetry.json is built from the run history of the directory the dashboard runs in, never the sample file bundled in the package; with no runs it is empty.

- id: UI-STATIC
  title: Every file the dashboard page uses is served
  accept: The favicon, logos and every asset index.html references answer 200 from the dashboard server; an unknown path is a 404.

- id: UI-STARTS
  title: The dashboard starts with nothing configured
  accept: The server starts without CIDRA_WEBHOOK_SECRET; /webhook then refuses every delivery with a 503 that names the missing variable, and still rejects bad signatures when it is set.

- id: UI-ENV
  title: Settings use your project's .env
  accept: CIDRA reads, and the Settings page writes, the .env in the directory CIDRA runs from (or CIDRA_ENV_FILE), not a file next to the installed package.

- id: UI-SCREENS
  title: Every dashboard screen works in a browser
  accept: Against the real server on fixed data, every screen opens with no console error, uncaught exception or failed request; a run opens with its patch, its approval is recorded, and its pull request is listed.
  jobs: [e2e]

- id: UI-TOKEN
  title: The dashboard works behind its access token
  accept: With CIDRA_DASHBOARD_TOKEN set, the runs and the API need the token; the link `cidra dashboard` prints carries it and the page sends it on every call; a page without it says how to get in instead of showing nothing or sample data.

- id: UI-PROBE
  title: Settings test the model setup CIDRA will use
  accept: The primary key's test is a one-token completion with the configured fix model at the configured endpoint, so a wrong key, endpoint or model id fails it with the provider's own message; the key is labelled with that endpoint's host, not a fixed provider name.

- id: UI-SETTINGS-HONEST
  title: Settings never show sample credentials
  accept: When the settings API cannot be read (the hosted demo, a stopped server), the page says where settings live and shows no keys, instead of a made-up configured set.

- id: UI-MODELS
  title: The model choice is one the endpoint serves
  accept: The Models tab offers the models CIDRA is set up for, each with its endpoint, plus any id typed in; choosing one saves the model and its endpoint to .env together, and no catalogue of ids for another provider is offered.

- id: UI-DEMO
  title: The scripted demo is labelled as a demo
  accept: The Command Center's button to the scripted walkthrough says it is a demo; nothing in the dashboard offers to launch a run it does not launch.

- id: UI-EVIDENCE
  title: The Run Explorer shows the evidence
  accept: A run's page shows what the report's evidence block shows - each test that matters before and after the patch (targets marked), the unchanged rest as a count, the run's cost when its price is known, and the command that reruns the verification - built from what the run recorded, never re-detected afterwards.

- id: G-23
  title: A crashed run leaves nothing running
  accept: When a node raises after the sandbox started, the run's container is removed and its checkout deleted, in every entry point (Action, CLI, server, eval/measure.py), not only when the graph reaches its cleanup node.

- id: G-24
  title: The CI env reaches the tests behind `cd ... &&`
  accept: The literal env values of the repo's workflow are exported before the test command, so a test command such as `cd sub && pytest` sees them in the real sandbox; names are validated and values quoted.

- id: COVERAGE
  title: Coverage cannot drop unnoticed
  accept: CI combines the unit, server and integration coverage of cidra/ and fails below the floor in pyproject.toml; the dashboard's component tests fail below the floors in dashboard/vite.config.js. The combined report is in the job summary.
  jobs: [coverage, frontend]

- id: PKG
  title: What users install works
  accept: The built wheel carries pyproject's version, the sandbox Dockerfile and exactly the dashboard files its page loads (no missing file, no stale bundle); installed in a clean venv and run from outside the checkout, the CLI starts, the sandbox image builds from the package, the dashboard serves every file, and `cidra action` reports a verified fix on a failing practice commit through a stand-in GitHub API. A release runs these same checks on the files it uploads to PyPI, and its tag must match the version.
  jobs: [package]

- id: M3-SCOPE
  title: Scope is read from the log, not taken from the model
  accept: A diagnosis of assertion_error is turned into unknown, and the run declined with the reason in the report, when the CI log shows a failure that opens with anything but a failed assert (an exception escaping the code under test). The other way round, a diagnosis of unknown is turned into assertion_error when every failure in the log opens with a failed assert (in corpus v7 thefuck-2 and tornado-1, 4, 8 and 10 were declined that way and never attempted). A log with no pytest failure detail leaves the model's diagnosis as it is. The corpus labels its cases with the same function, so on the corpus the declines match by construction; the false-verified effect is judged by held-out tests.

- id: M3-NO-SILENCED-ERRORS
  title: A fix may not delete the error it is meant to fix
  accept: The audit gate refuses a patch that removes more `raise` statements than it adds in a non-test Python file (corpus v6, tornado-3), or that adds an `except` whose body, comments aside, is only `pass` or `...` (v7, tornado-3 again), so a failing test cannot be made to pass by deleting or swallowing the error that fails it. Handling an error (returning a value, logging and re-raising) passes. Moving or rewording a raise passes; every reference fix in the fixtures and the corpus, and the v6 fixes judged genuine, still pass the gate.

- id: M3-REPEATABLE
  title: The same failure gets the same diagnosis and fix from run to run
  accept: Every model call (diagnosis and fix, primary and fallback) is sent with temperature 0, so a measured change in results comes from a change in CIDRA, not from sampling. At the provider default (1.0 for Claude) the same tornado logs were diagnosed differently in corpus runs v4 and v5.

- id: M3-HELDOUT
  title: Every real bug CIDRA claims to fix is judged by tests the model never saw
  accept: Each BugsInPy case with a verified fix has held-out tests in its held_out/ folder, written apart from the visible test, and a held_out_command that runs them; each set passes on the project's fix and fails on the buggy commit where the visible run did not (measure.py --validate); the README's false-verified number is the judgement on file from measure.py --rejudge, which lists for each case the held-out failures that make it valid.

- id: G-25
  title: The verdict is judged from every test, not the log's tail
  accept: Reproduction (which tests fail, the second run's check for flakiness) and verification (target still failing, regressions) read the failed and errored tests from pytest's JUnit report of that run, which lists every test; a collection error counts by its module. Only a run with no readable report falls back to the FAILED lines of the log. Shown on the real sandbox with a target and a regression that the 16 KB log tail does not hold.

- id: COMPAT
  title: Every Python CIDRA says it supports is tested
  accept: The unit and server tests pass on Linux with each Python from requires-python's floor to the newest release (3.10 to 3.14) and on Windows; the PyPI classifiers and the README badge list exactly those versions.
  jobs: [compat]

- id: CI-NET
  title: A network hiccup does not fail CI as if the code were broken
  accept: Every step that downloads (git clone, docker build, npm ci, the Playwright browser install), in the workflows and in the installed-package smoke test, runs through scripts/retry.sh, up to 3 tries with a warning on the run for each retry; no test step does, so a test that fails once fails CI.

- id: LINT
  title: No Python errors, likely bugs or type errors merge
  accept: ruff checks cidra/, scripts/, eval/ and tests/ for pyflakes errors, import and syntax errors and bugbear patterns, and mypy type-checks cidra/ (settings in pyproject.toml); the unit job fails on any finding of either.
  jobs: [unit]

- id: SEC-CI
  title: The build's supply chain is checked
  accept: Every third-party Action in the workflows and in action.yml is pinned to a commit, every CI job has a time limit, CIDRA's Python dependencies and the dashboard's npm packages have no known vulnerability (npm high and up), and CodeQL analyses the Python and JavaScript code on every code change. Dependabot proposes weekly updates for Actions, pip and npm.
  jobs: [audit, codeql]

- id: RESULTS-REPORT
  title: Published results are measured, never typed in
  accept: reports/RESULTS.md's table of BugsInPy runs is computed from the committed result files in eval/results/ by eval/results_table.py, and every file the report links to exists.

- id: G-19
  title: Settings saved in the dashboard take effect without a restart
  accept: A model key, base URL, Gemini key, GitHub write or read-only token, or webhook secret saved through the settings API is used by the next model call, GitHub call or webhook check of the running server; with no read-only token, reads use the write token saved last. Max fix attempts, flaky runs and threshold, and the test/verify timeout saved there are used by the next run, read from the environment at startup, and clamped to their bounds.

- id: M8-VERIFY-AUDIT
  title: cidra verify runs the audit gate before any sandbox work
  accept: A diff given to `cidra verify` goes through the same audit gate as the pipeline's patches, with the failing test named by --target standing in for a diagnosis. A diff that removes a failing test's assert or catches an error to ignore it is refused with its reasons and exit 1, before the sandbox is set up; a diff the gate accepts goes on to reproduction and verification.

- id: M8-VERIFY-ANY-DIFF
  title: cidra verify takes the fix from wherever it was written
  accept: The diff comes from a file (--patch), stdin (--patch -) or a branch (--branch, diffed against --sha from their common ancestor); --patch and --branch together are a usage error. An empty diff or a branch that does not exist is an error with exit 1, never a pass, and stops before the sandbox.

- id: M8-CHECK-PR
  title: A fix pull request is checked by the gate, with no model and no key
  accept: "`cidra check-pr`, and the Action's check-pr mode, take the pull request's base as the failing commit and its diff (from the event, or --base and --head) as the fix, and give one verdict per pull request: a genuine fix is verified; a diff that weakens the failing test or swallows an error is refused before it runs; a diff that breaks another test is not verified and names it; a pull request that changes nothing is not verified. The verdict goes to the job summary, a step output and a file, the exit code is 0 only when verified, and the Action posts it in a separate step that runs no code from the pull request, while the check step gets no token."

- id: M8-GATE
  title: The gate is one entry point that needs no model
  accept: gate.check takes a repository, the failing commit, the diff and the tests that must go green, and returns a verdict (verified, refused, not verified, not reproduced, or could not run) with the run's state, using the pipeline's own audit, reproduction and verification steps. Its markdown is the PR comment or job summary, a headline and the evidence block with a rerun command; only a verified verdict claims success. A refused diff never reaches the sandbox. `cidra verify` is a wrapper around it.

- id: M7-GENERATOR
  title: The patch generator is pluggable and untrusted
  accept: The patch is written by the generator named in CIDRA_PATCH_GENERATOR, read at call time, with CIDRA's built-in model loop as the default. Of what a generator returns only the diff and the reason there is none are kept; anything else it claims (a test result, "verified", an audit verdict) is dropped, and an unknown generator is an error, not a patch.

- id: M7-KEY-PROXY
  title: The model key stays out of reach of repository code next to an agent
  accept: A coding agent's container is on an internal network whose only other member is the model-key proxy. Code run there cannot find the key in its environment or any process's, cannot reach the model endpoint or the internet directly, and gets only model calls through the proxy, which carry the real key in place of whatever the caller sent (an API key, or a bearer token). Any other path is refused, the run stops at its request limit, and an unreachable endpoint is an error, not a hang.

- id: M7-CLAUDE-CODE
  title: Claude Code writes the patch, CIDRA reads it
  accept: With CIDRA_PATCH_GENERATOR=claude-code, Claude Code runs headless and bare in a container on the key proxy's network, with the checkout, the run's installed packages, the failing tests and the rules the gate enforces, and a placeholder key. The patch is the git diff of what it changed, without test-run leftovers; what it prints is not read. Its model calls are counted by the proxy from the replies and priced with cache tokens. No key is an error before any container starts.

- id: G-20
  title: Exported telemetry never carries what the model was shown or said
  accept: The telemetry CIDRA exports (the dashboard's /telemetry.json and the bot's uploaded artifact) holds counts, latency and the validated diagnosis, but no system or user prompt, raw model output or CI log; the full state with prompts is kept only in files git ignores.
